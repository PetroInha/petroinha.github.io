# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Center for Unconventional Resources and Energy
email: hyundon.shin@inha.ac.kr
description: >- # shown in the site footer and in search-engine / social previews
  CURE Lab at Inha University combines physics, data and AI for subsurface
  energy: CO2 geological storage, underground hydrogen storage, digital rock
  physics and AI-driven reservoir modeling.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://petroinha.github.io" # needed for absolute links in the feed, sitemap and social previews
# twitter_username is deliberately unset: minima renders a footer link to
# twitter.com/<value> for any non-empty value, and "N/A" produced a dead link.
github_username:  PetroInha
lang: en

# Build settings
theme: minima
# All three are on GitHub Pages' plugin whitelist, so they run on the default
# Pages builder without a custom Actions workflow.
#   jekyll-feed     -> /feed.xml
#   jekyll-seo-tag  -> <title>, meta description, Open Graph and Twitter cards
#                      (minima's head.html already calls {% seo %})
#   jekyll-sitemap  -> /sitemap.xml for search engines
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Jekyll skips any directory whose name starts with "_", so _images/ is not
# copied into _site by default — which is why most pages link their images
# from raw.githubusercontent.com instead. The energy dashboard has to be
# served by the site itself (an iframe cannot render raw.githubusercontent
# HTML, which is returned as text/plain), so publish the folder explicitly.
include:
  - _images

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
